name: Publicar app do método

# Publica o app do Método Bem Viver (vladimirhersen.com.br/bemviver) sempre que algo
# dentro de bemviver/ muda na main.
on:
  push:
    branches: [main]
    paths: ['bemviver/**']
  workflow_dispatch:

concurrency: bemviver-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bemviver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # Carimba a versão: o celular de quem tem o app percebe a mudança e mostra "Atualizar".
      - run: sed -i "s/__VERSAO__/$(date -u +%Y%m%d%H%M)-${GITHUB_SHA::7}/" public/bemviver/sw.js
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
