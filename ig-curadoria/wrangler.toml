# Worker que recebe comentários e DMs do Instagram, sugere respostas com Claude
# e manda para aprovação no Telegram. Publicado pelo GitHub Actions (ig-curadoria-deploy.yml).
name = "ig-curadoria"
main = "src/worker.js"
compatibility_date = "2026-10-12"
workers_dev = true
preview_urls = false

# Mantém as variáveis já configuradas no painel da Cloudflare (IG_USER_ID, VERIFY_TOKEN,
# SUPABASE_URL, MODEL, TELEGRAM_CHAT_ID). Os secrets nunca são tocados pelo deploy.
keep_vars = true

# Renovação diária do token do Instagram (03:00 em Brasília).
# A cada 5 minutos: avisa no Telegram as inscrições novas do site.
[triggers]
crons = ["0 6 * * *", "*/5 * * * *"]

# Banco de inscrições do site vladimirhersen.com.br (só leitura aqui).
[[d1_databases]]
binding = "SITE_DB"
database_name = "oficina-inscricoes"
database_id = "ed3b7ba5-e6a0-4898-994c-5170bd43f16f"

# Logs no painel da Cloudflare (estavam ligados antes de o Worker vir para o GitHub).
[observability]
enabled = true

[observability.logs]
enabled = true
